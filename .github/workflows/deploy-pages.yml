name: Triển khai website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6
      - name: Cài Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Tạo và kiểm tra website
        run: |
          python build.py
          python check.py
          node --check src/app.js
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Triển khai website
        id: deployment
        uses: actions/deploy-pages@v4
